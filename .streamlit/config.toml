# Theme for the AgentSysID Streamlit UI.
# Mirrors the design tokens in frontend_mockup/labcd_sysid.html so the
# reference UI and the HTML mock read as the same product.

[theme]
base = "dark"
primaryColor = "#6e7d73"
backgroundColor = "#212121"
secondaryBackgroundColor = "#303030"
textColor = "#ececec"
font = "sans serif"
headingFont = "sans serif"
codeFont = "monospace"
codeFontSize = "13px"
codeTextColor = "#9cdcfe"
codeBackgroundColor = "#191919"
borderColor = "#424242"
linkColor = "#b7cfc1"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = true
redColor = "#f48771"
orangeColor = "#ce9178"
yellowColor = "#dcdcaa"
greenColor = "#4ec9b0"
blueColor = "#569cd6"
violetColor = "#c586c0"
chartCategoricalColors = ["#4ec9b0", "#ce9178", "#569cd6", "#dcdcaa", "#c586c0", "#6a9955", "#f48771"]

[theme.sidebar]
backgroundColor = "#171717"
secondaryBackgroundColor = "#292929"
codeBackgroundColor = "#191919"
textColor = "#ececec"
borderColor = "#303030"
primaryColor = "#6e7d73"

[server]
headless = true

[browser]
gatherUsageStats = false
