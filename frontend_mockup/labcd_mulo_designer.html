<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MuloDesigner · Chat mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#212121; --bg-elevated:#2f2f2f; --bg-hover:#3a3a3a; --bg-input:#303030;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.12);
  --text:#ececec; --text-secondary:#b4b4b4; --text-muted:#8e8e8e; --text-faint:#6b6b6b;
  --accent:#10a37f; --accent-soft:rgba(16,163,127,.14);
  --user-bubble:#2f2f2f; --code-bg:#1a1a1a; --code-gutter:#1e1e1e;
  --keyword:#c586c0; --string:#ce9178; --comment:#6a9955; --fn:#dcdcaa; --param:#9cdcfe; --number:#b5cea8;
  --warn:#fbbf24;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;font-size:15px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:var(--rail-w,0px) minmax(0,1fr) var(--panel-w,0px);height:100vh;width:100%}
.app.rail-open{--rail-w:256px}
.app.panel-open{--panel-w:minmax(420px,48%)}
.app:not(.rail-open) .rail{visibility:hidden}
.app:not(.panel-open) .panel{visibility:hidden}

/* ---------- artifact rail (collapsed by default) ---------- */
.rail{min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.app.rail-open .rail{border-right:1px solid var(--border)}
.rail__inner{width:256px;height:100%;display:flex;flex-direction:column}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 10px 16px;font-size:12.5px;color:var(--text-muted)}
.rail-list{flex:1;overflow-y:auto;padding:0 10px 16px;display:flex;flex-direction:column;gap:6px}
.rail-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;text-align:left;width:100%;border:1px solid transparent;transition:background .15s}
.rail-item:hover{background:var(--bg-elevated)}
.rail-item[aria-pressed="true"]{background:var(--bg-hover);border-color:var(--border-strong)}
.rail-item .artifact__body{min-width:0;flex:1}
.rail .artifact__icon{width:32px;height:32px;font-size:12px;border-radius:9px}
.count{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.08);font-size:11px;color:var(--text-secondary);margin-left:6px;font-variant-numeric:tabular-nums}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text-muted);font-size:17px}
.icon-btn:hover{background:var(--bg-hover);color:var(--text)}

/* ---------- chat column ---------- */
.chat{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}
.chat-head{height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px}
.handle{display:inline-flex;align-items:center;font-size:12.5px;color:var(--text-secondary);padding:5px 10px;border-radius:999px;border:1px solid var(--border-strong)}
.handle:hover{background:var(--bg-hover);color:var(--text)}
.brand{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--text-secondary);padding:5px 12px;border-radius:999px;background:var(--bg-elevated);border:1px solid var(--border);opacity:0;transition:opacity .5s ease;margin:0 auto}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(16,163,127,.18)}
.chat.live .live-dot{animation:pulse 1.6s ease-in-out infinite}
.chat-head.active .brand{opacity:1}
.reset{font-size:12.5px;color:var(--text-muted);padding:5px 10px;border-radius:8px;opacity:0;transition:opacity .5s ease}
.chat-head.active .reset{opacity:1}
.reset:hover{background:var(--bg-hover);color:var(--text)}
.chat__scroll{flex:1;min-height:0;overflow-y:auto;padding:12px 0 24px;display:flex;flex-direction:column;align-items:center}
.chat__inner{width:100%;max-width:720px;padding:0 24px;display:flex;flex-direction:column;gap:22px}
.chat__scroll::-webkit-scrollbar{width:8px}
.chat__scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}

/* empty state: composer centred, hint above it */
.composer-wrap{flex-shrink:0;padding:8px 24px 22px;display:flex;flex-direction:column;align-items:center;transition:transform .5s cubic-bezier(.4,0,.2,1);width:100%}
.chat.is-empty .composer-wrap{transform:translateY(-16vh)}
.empty-hint{display:none;text-align:center;color:var(--text-muted);font-size:15px;max-width:440px;margin:0 auto 18px;line-height:1.5}
.chat.is-empty .empty-hint{display:block}
.case-row{margin-top:12px;display:flex;justify-content:center}
.chat.is-empty .reset{pointer-events:none}
.chat.is-empty .chat__scroll{visibility:hidden}

/* composer (ChatGPT-style pill) */
.composer{width:100%;max-width:720px;background:var(--bg-input);border:1px solid var(--border-strong);border-radius:24px;padding:12px 14px 12px 18px;display:flex;align-items:flex-end;gap:10px}
.composer textarea{flex:1;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:inherit;font-size:15px;line-height:1.45;max-height:120px;min-height:24px}
.composer textarea::placeholder{color:var(--text-faint)}
.composer__send{width:32px;height:32px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex-shrink:0;opacity:.35}
.composer__send:not(:disabled){opacity:1}
.composer__send:disabled{cursor:not-allowed}

/* ---------- turns ---------- */
.user-turn{display:flex;justify-content:flex-end}
.user-bubble{background:var(--user-bubble);border-radius:18px;padding:10px 16px;font-size:15px;line-height:1.45;max-width:420px}
.assistant-turn{display:flex;flex-direction:column;gap:12px;width:100%;animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.agent-tag{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--text-muted)}
.agent-tag .em{font-size:14px}
.route{font-size:12px;color:var(--text-faint)}
.assistant-text{font-size:15px;line-height:1.6;color:var(--text)}
.assistant-text p+p{margin-top:10px}
.note{font-size:13px;color:var(--text-faint);font-style:italic}
.dots{display:flex;gap:5px;padding:6px 0}
.dots span{width:6px;height:6px;border-radius:50%;background:var(--text-faint);animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}
.dots span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}

/* tool trace (collapsed by default) */
.tool-trace{display:flex;flex-direction:column;gap:8px}
.tool-trace__summary{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--text-secondary);padding:2px 0;width:fit-content}
.tool-trace__summary:hover{color:var(--text)}
.tool-trace__summary svg{transition:transform .2s;flex-shrink:0}
.tool-trace__summary[aria-expanded="true"] svg{transform:rotate(180deg)}
.tool-trace__list{display:none;border:1px solid var(--border-strong);border-radius:12px;overflow:hidden}
.tool-trace__list[data-open="true"]{display:block}
.tool-trace__item{padding:9px 14px;font-size:13.5px;color:var(--text-secondary);border-bottom:1px solid var(--border);line-height:1.4}
.tool-trace__item:last-child{border-bottom:none}
.spin{width:11px;height:11px;border-radius:50%;border:1.6px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block;flex-shrink:0}
.ok-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex-shrink:0}

/* single live status line (the one thing that updates in place) */
.run-status{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.run-status .run-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(16,163,127,.2);animation:pulse 1.6s ease-in-out infinite;flex-shrink:0}

/* artifact chip groups */
.artifacts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px}

/* ---------- Human-in-the-loop card (from chatgpt-style-ui reference) ---------- */
.hitl-status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--warn)}
.hitl-status.ok{color:#86efac}
.hitl-status__dot{width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 3px rgba(251,191,36,.2);animation:pulse 1.6s ease-in-out infinite}
.hitl-status__dot.ok{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);animation:none}
.hitl-card{width:100%;max-width:520px;border:1px solid var(--border-strong);border-radius:14px;background:var(--bg-elevated);overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.25);transition:opacity .2s}
.hitl-card.is-resolved{opacity:.72;pointer-events:none}
.hitl-card__header{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.hitl-card__header-text{flex:1;min-width:0}
.hitl-card__title{font-size:14.5px;font-weight:500;line-height:1.4}
.hitl-card__subtitle{font-size:12.5px;color:var(--text-muted);margin-top:4px;line-height:1.35}
.hitl-card__timeout{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid transparent;cursor:default;transition:border-color .15s,background .15s}
.hitl-card__timeout:hover{border-color:var(--border-strong);background:rgba(255,255,255,.06)}
.hitl-card__timeout-ring{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin 1s linear infinite;flex-shrink:0}
.hitl-card__timeout[data-paused="true"] .hitl-card__timeout-ring{animation:none;border-top-color:rgba(255,255,255,.25)}
.hitl-card__timeout-cancel{display:none;width:18px;height:18px;border-radius:4px;place-items:center;color:var(--text-muted)}
.hitl-card__timeout:hover .hitl-card__timeout-cancel{display:grid}
.hitl-card__close{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--text-muted);flex-shrink:0;margin:-4px -4px 0 0}
.hitl-card__close:hover{background:var(--bg-hover);color:var(--text)}
.hitl-card__options{display:flex;flex-direction:column;padding:4px 0}
.hitl-option{display:flex;align-items:center;gap:12px;padding:11px 16px;font-size:14px;text-align:left;width:100%;transition:background .12s;border-bottom:1px solid var(--border);line-height:1.35}
.hitl-option:last-child{border-bottom:none}
.hitl-option:hover{background:var(--bg-hover)}
.hitl-option[aria-pressed="true"]{background:rgba(16,163,127,.12)}
.hitl-option__badge{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--border-strong);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--text-secondary);flex-shrink:0}
.hitl-option[aria-pressed="true"] .hitl-option__badge{background:var(--accent);border-color:var(--accent);color:#fff}
.hitl-option__label{flex:1;min-width:0}
.hitl-option__label strong{font-weight:500}
.defmark{margin-left:8px;font-size:11px;color:var(--text-muted);border:1px solid var(--border-strong);border-radius:999px;padding:0 6px}
.hitl-option__desc{display:block;font-size:12.5px;color:var(--text-muted);margin-top:2px}
.hitl-other{display:flex;align-items:center;padding:8px 16px;border-top:1px solid var(--border)}
.hitl-other input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:13.5px;padding:6px 0}
.hitl-other input::placeholder{color:var(--text-faint)}
.hitl-card__footer{display:flex;align-items:center;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.hitl-card__edit{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border-strong);font-size:13px;color:var(--text-secondary);transition:background .12s,color .12s}
.hitl-card__edit:hover{background:var(--bg-hover);color:var(--text)}
.hitl-card__skip{margin-left:auto;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-muted);transition:background .12s,color .12s}
.hitl-card__skip:hover{background:var(--bg-hover);color:var(--text)}
.hitl-card__confirm{padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;background:var(--accent);color:#fff;transition:filter .12s}
.hitl-card__confirm:hover{filter:brightness(1.08)}
.hitl-card__confirm:disabled{opacity:.4;cursor:not-allowed;filter:none}

/* ---------- inline config card ---------- */
.cfg-card{width:100%;max-width:520px;border:1px solid var(--border-strong);border-radius:14px;background:var(--bg-elevated);padding:14px 16px}
.cfg-card.is-done{opacity:.6;pointer-events:none}
.cfg-title{font-size:11.5px;letter-spacing:.05em;color:var(--text-muted);font-weight:600;margin-bottom:6px}
.cfg-row{display:flex;gap:12px;padding:7px 0;border-top:1px solid var(--border);font-size:13.5px;line-height:1.45;align-items:baseline}
.cfg-row>span:first-child{width:96px;color:var(--text-muted);flex-shrink:0}
.cfg-row .val{color:var(--text);font-weight:500}
.cfg-row .obj{color:var(--text-secondary);font-style:italic}
.obj-edit{display:flex;gap:6px;flex:1;min-width:0}
.obj-input{flex:1;min-width:0;background:var(--bg-input);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;padding:5px 8px;outline:none}
.cfg-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.cfg-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--border);margin-top:12px;padding-top:12px}
.chip-btn{border:1px solid var(--border-strong);padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--text-secondary);background:transparent;transition:background .12s,color .12s}
.chip-btn:hover{background:var(--bg-hover);color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--border-strong);padding:7px 12px;border-radius:9px;font-size:13px;color:var(--text-secondary)}
.btn-ghost:hover{background:var(--bg-hover);color:var(--text)}
.link-btn{color:var(--text-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;text-align:left}
.link-btn:hover{color:var(--text)}
.next-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

/* ---------- artifact chip (ChatGPT-style card) ---------- */
.artifact{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--border-strong);background:var(--bg-elevated);transition:background .15s,border-color .15s;cursor:pointer;text-align:left;width:100%}
.artifact:hover{background:var(--bg-hover);border-color:rgba(255,255,255,.18)}
.artifact__icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:14px;font-weight:600;color:#fff}
.artifact__icon svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gl{font-family:var(--mono);font-size:13px}
.ico-tuning{background:linear-gradient(145deg,#14b8a6,#0f766e)}
.ico-arch{background:linear-gradient(145deg,#3b82f6,#1d4ed8)}
.ico-sandbox{background:linear-gradient(145deg,#8b5cf6,#6d28d9)}
.ico-code{background:linear-gradient(145deg,#c47a3a,#a35f28)}
.ico-json{background:linear-gradient(145deg,#64748b,#334155)}
.ico-report{background:linear-gradient(145deg,#db7093,#be185d)}
.ico-config{background:linear-gradient(145deg,#a3a3a3,#525252)}
.artifact__body{flex:1;min-width:0}
.artifact__title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artifact__type{font-size:12px;color:var(--text-muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-actions{display:flex;gap:6px;flex-shrink:0}
.artifact__action{padding:5px 12px;border-radius:999px;border:1px solid var(--border-strong);font-size:12.5px;font-weight:500;color:var(--text);white-space:nowrap;cursor:pointer;transition:background .15s}
.artifact__action:hover{background:var(--bg-hover)}
.spark{width:100%;height:22px;margin-top:4px;display:block}
.spark path{fill:none;stroke:#60a5fa;stroke-width:1.4}

/* ---------- artifact detail panel (code-panel chrome from reference) ---------- */
.panel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--code-bg);border-left:1px solid var(--border);overflow:hidden}
.panel.enter{animation:panelIn .28s ease}
@keyframes panelIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.code-panel__header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:#1e1e1e}
.panel-titles{flex:1;min-width:0}
.code-panel__title{font-size:13.5px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel-type{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code-panel__actions{display:flex;align-items:center;gap:4px}
.code-panel__btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:8px;font-size:13px;color:var(--text-secondary);border:1px solid transparent;white-space:nowrap}
.code-panel__btn:hover{background:var(--bg-hover);color:var(--text)}
.code-panel__btn--icon{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:18px}
.code-panel__body{flex:1;min-height:0;overflow:auto;display:flex}
.code-panel__body::-webkit-scrollbar{width:8px;height:8px}
.code-panel__body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.pv{flex:1;min-width:0;padding:18px 20px 28px;display:flex;flex-direction:column;gap:16px}
.pv--code{padding:0;flex-direction:row;gap:0}
.code-gutter{flex-shrink:0;padding:16px 0;background:var(--code-gutter);border-right:1px solid var(--border);user-select:none;text-align:right;min-width:48px}
.code-gutter span{display:block;padding:0 12px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:var(--text-faint)}
.code-source{flex:1;padding:16px 20px;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre;overflow-x:auto;tab-size:4;color:var(--text);margin:0}
.tok-kw{color:var(--keyword)}
.tok-fn{color:var(--fn)}
.tok-str{color:var(--string)}
.tok-cm{color:var(--comment)}
.tok-param{color:var(--param)}
.tok-num{color:var(--number)}
.sec-title{font-size:12px;color:var(--text-muted);font-weight:500;margin-top:4px}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:#1e1e1e;border:1px solid var(--border);border-radius:10px;padding:9px 10px;min-width:0}
.tile__k{font-size:11px;color:var(--text-muted);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile__v{font-size:16px;font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile__s{font-size:11px;color:var(--text-faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px}
.tile.ok .tile__v{color:#86efac}
.tile.warn .tile__v{color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--mono);font-size:11.5px;color:var(--text-secondary);border:1px solid var(--border-strong);border-radius:999px;padding:3px 9px;white-space:nowrap}
.plot{border:1px solid var(--border-strong);border-radius:12px;background:#1a1a1a;padding:8px}
.chart{width:100%;height:auto;display:block}
.ax{fill:#6b6b6b;font-size:10px;font-family:var(--mono)}
.grid{stroke:#2a2a2a;stroke-width:1}
.axis{stroke:#555;stroke-width:1}
.gain-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gain-card{border:1px solid var(--border-strong);border-radius:12px;background:#1a1a1a;padding:8px;min-width:0}
.gain-card__t{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:4px 6px;margin-bottom:4px}
.gain-card__t span{font-family:var(--mono);font-size:11px;color:var(--text-muted)}
.llm-line{font-size:14px;line-height:1.6;color:var(--text-secondary)}
.att-wrap summary{cursor:pointer;color:var(--text-secondary);font-size:13px}
table.att{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.att th,table.att td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
table.att th{color:var(--text-muted);font-weight:500}
.cap{font-size:13px;color:var(--text-muted);line-height:1.55}
.arch-wrap{border:1px solid var(--border-strong);border-radius:12px;background:#1a1a1a;padding:10px}
.arch-wrap svg{width:100%;height:auto;display:block}
.empty-plot{font-size:13px;color:var(--text-faint);padding:28px 0;text-align:center}
.note-i{font-size:12px;color:var(--text-faint);font-style:italic;line-height:1.5}

/* ---------- Simulation Lab (sandbox) ---------- */
.lab-card{border:1px solid var(--border-strong);border-radius:14px;background:#242424;padding:14px 16px 16px}
.lab-head{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;margin-bottom:4px}
.lab-head .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(16,163,127,.2)}
.lab-head__sub{font-family:var(--mono);font-size:11.5px;color:var(--text-muted);margin-left:auto}
.lab-section{font-size:11.5px;color:var(--text-muted);font-weight:500;margin:14px 0 8px}
.lab-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 12px}
.lab-grid--sat{grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);align-items:end}
.lab-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.lab-field>label{font-size:11.5px;color:var(--text-muted);font-weight:500}
.lab-stepper{display:flex;align-items:center;background:#1a1a1a;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;height:36px}
.lab-stepper input{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-family:var(--mono);font-size:13px;text-align:center;outline:none;height:100%;-moz-appearance:textfield}
.lab-stepper input::-webkit-outer-spin-button,.lab-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lab-stepper button{width:30px;height:100%;display:grid;place-items:center;color:var(--text-muted);font-size:15px;flex-shrink:0}
.lab-stepper button:hover{background:rgba(255,255,255,.06);color:var(--text)}
.lab-select{height:36px;border-radius:10px;border:1px solid var(--border-strong);background:#1a1a1a;color:var(--text);font-family:inherit;font-size:13px;padding:0 10px;outline:none;width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);height:36px;white-space:nowrap}
.lab-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.lab-status{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lab-status .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.lab-status code{font-family:var(--mono);font-size:12px;color:#86efac;background:rgba(16,163,127,.12);padding:1px 6px;border-radius:4px}
.lab-plot{border:1px solid var(--border-strong);border-radius:14px;background:#1e1e1e;padding:10px 8px 8px}
.lab-plot.flash{animation:flash2 .35s ease}
@keyframes flash2{from{opacity:.45}to{opacity:1}}
.lab-legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:2px 8px 8px;font-size:11.5px;color:var(--text-muted)}
.lab-legend span{display:inline-flex;align-items:center;gap:6px}
.lab-legend i{width:14px;height:2px;border-radius:1px;display:inline-block}
.lab-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sessions{font-size:12px;color:var(--text-secondary);padding-left:18px;display:flex;flex-direction:column;gap:4px}
.sessions li{font-family:var(--mono);font-size:11.5px}

/* toggles and text areas */
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer;position:relative;height:36px}
.switch input{position:absolute;opacity:0;width:0;height:0}
.track{width:34px;height:20px;border-radius:999px;background:#444;position:relative;transition:background .15s;flex-shrink:0}
.track::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{left:16px}
.cfg-text{width:100%;background:#1a1a1a;border:1px solid var(--border-strong);border-radius:10px;color:var(--text);font-family:inherit;font-size:13.5px;padding:8px 10px;resize:vertical;outline:none}

/* decision log */
.dec{border:1px solid var(--border-strong);border-radius:10px;background:#1e1e1e}
.dec summary{display:flex;gap:8px;align-items:center;padding:9px 12px;cursor:pointer;font-size:13px;list-style:none}
.dec summary::-webkit-details-marker{display:none}
.dec[open] summary{border-bottom:1px solid var(--border)}
.dec .who{font-weight:500;white-space:nowrap}
.dec .when{font-family:var(--mono);font-size:11px;color:var(--text-faint);white-space:nowrap}
.dec .what{color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.dec-json{margin:0;padding:10px 12px;font-family:var(--mono);font-size:12px;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}

/* JSON tree */
.jn{font-family:var(--mono);font-size:12.5px;line-height:1.6}
.jn>summary{cursor:pointer;list-style:none;color:var(--text-secondary)}
.jn>summary::-webkit-details-marker{display:none}
.jc{padding-left:18px;border-left:1px solid var(--border);margin-left:4px}
.jl{font-family:var(--mono);font-size:12.5px;line-height:1.6;padding-left:18px}
.jk{color:var(--param)}
.jp{color:var(--text-muted)}
.jm{color:var(--text-faint);font-size:11px}

/* comparison report */
.rep{width:100%;border-collapse:collapse;font-size:12.5px}
.rep th,.rep td{border-bottom:1px solid var(--border);padding:7px 8px;text-align:left;white-space:nowrap}
.rep th{color:var(--text-muted);font-weight:500}
.rep td.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* accessibility: honour reduced motion */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* printing the comparison report to PDF */
body.printing .chat,body.printing .rail,body.printing .handle{display:none!important}
body.printing .app{display:block!important}
body.printing .panel{display:flex!important;visibility:visible!important;width:100%;border:none}
body.printing .panel,body.printing .panel *{background:#fff!important;color:#000!important;border-color:#bbb!important}
body.printing .code-panel__actions,body.printing #panelClose{display:none!important}

</div>

    openArtifact(a.id);
  });
  b.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openArtifact(a.id); } });
  return b;
}

function addArtifact(o,container){

/* ================= series helpers (deterministic, built from the attempt results) ================= */
function bandsFor(key,idx){
  var L=LOOPS[key], out=[], p=L.nfeStart;
  for(var i=0;i<=idx;i++){ var r=L.done[i]; out.push({x0:p,x1:r.nfeEnd,label:"A"+(i+1)}); p=r.nfeEnd; }
  return out;
}
function costPts(key,upTo){
  var L=LOOPS[key], out=[], pn=L.nfeStart, pb=L.baseline;
  for(var i=0;i<=upTo;i++){
    var r=L.done[i], rnd=seeded(17+i*5+(key==="outer"?40:0));
    for(var s=0;s<=14;s++){
      if(i>0 && s===0) continue;
      var t=s/14, x=pn+(r.nfeEnd-pn)*t;
      var y=pb+(r.best-pb)*(1-Math.exp(-3*t))/(1-Math.exp(-3)) + (rnd()-0.5)*0.004*(1-t);
      out.push([x,Math.max(y,r.best*0.9)]);
    }
    pn=r.nfeEnd; pb=r.best;
  }
  return out;
}
function gainPts(key,upTo,ctrl,param){
  var L=LOOPS[key], out=[], pn=L.nfeStart, pv=START[ctrl][param];
  for(var i=0;i<=upTo;i++){
    var r=L.done[i], tgt=r.gains[ctrl][param];
    for(var s=0;s<=10;s++){
      if(i>0 && s===0) continue;
      var t=s/10, e=t*t*(3-2*t);
      out.push([pn+(r.nfeEnd-pn)*t, pv+(tgt-pv)*e]);
    }
    pn=r.nfeEnd; pv=tgt;
  }
  return out;
}
function sparkSvg(a){
  var L=LOOPS[a.data.loop], idx=a.data.idx<0?L.done.length-1:a.data.idx;
  var pts=costPts(a.data.loop,idx);
  var xs=pts.map(function(p){ return p[0]; }), ys=pts.map(function(p){ return p[1]; });
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs), y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
  var d=pts.map(function(p,i){
    return (i?"L":"M")+(((p[0]-x0)/((x1-x0)||1))*220).toFixed(1)+","+(24-((p[1]-y0)/((y1-y0)||1))*22).toFixed(1);
  }).join("");
  return '<svg class="spark" viewBox="0 0 220 26" preserveAspectRatio="none"><path d="'+d+'"/></svg>';
}
function makeCfg(key){
  return {optimizer:"Agentic GA", llm:"gpt-4o-mini", maxAttempts:5, wallClock:150, budget:1, history:3,
    variant:"elaborate", seed:42, webSearch:false, pop:20, gens:15,
    objective: key==="inner" ? "Stabilize rates with minimal overshoot, settle <1s" : "Track angle setpoints with minimal cross-coupling, settle <3s",
    _editing:false};
}

/* ================= SVG line chart (hand-drawn, no library) ================= */
function lineChart(o){
  var W=o.w||560, H=o.h||170, pl=44, pr=10, pt=10, pb=22;
  var all=[]; o.series.forEach(function(s){ s.pts.forEach(function(p){ all.push(p); }); });
  var x0=o.x0!==undefined?o.x0:Math.min.apply(null,all.map(function(p){return p[0];}));
  var x1=o.x1!==undefined?o.x1:Math.max.apply(null,all.map(function(p){return p[0];}));
  var y0=o.y0!==undefined?o.y0:Math.min.apply(null,all.map(function(p){return p[1];}));
  var y1=o.y1!==undefined?o.y1:Math.max.apply(null,all.map(function(p){return p[1];}));
  if(x1===x0) x1=x0+1;
  if(y1===y0) y1=y0+1;
  if(o.y0===undefined || o.y1===undefined){
    var pad=(y1-y0)*0.08;
    if(o.y0===undefined) y0-=pad;
    if(o.y1===undefined) y1+=pad;
  }
  function X(x){ return pl+(x-x0)/(x1-x0)*(W-pl-pr); }
  function Y(y){ return pt+(1-(y-y0)/(y1-y0))*(H-pt-pb); }
  var yFmt=o.yFmt||function(n){ return n.toFixed(2); };
  var xFmt=o.xFmt||function(n){ return String(Math.round(n)); };
  var g="";
  (o.bands||[]).forEach(function(b,i){
    var xa=X(b.x0), xb=X(b.x1);
    g+='<rect x="'+xa.toFixed(1)+'" y="'+pt+'" width="'+Math.max(0,xb-xa).toFixed(1)+'" height="'+(H-pt-pb)+'" fill="'+(i%2?"rgba(255,255,255,0.02)":"rgba(255,255,255,0.05)")+'"/>';
    g+='<text class="ax" x="'+((xa+xb)/2).toFixed(1)+'" y="'+(pt+10)+'" text-anchor="middle">'+b.label+'</text>';
  });
  for(var k=0;k<=3;k++){
    var v=y0+(y1-y0)*k/3, yy=Y(v).toFixed(1);
    g+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+yy+'" y2="'+yy+'"/>';
    g+='<text class="ax" x="'+(pl-6)+'" y="'+(parseFloat(yy)+3).toFixed(1)+'" text-anchor="end">'+yFmt(v)+'</text>';
  }
  for(var j=0;j<=4;j++){
    var xv=x0+(x1-x0)*j/4;
    g+='<text class="ax" x="'+X(xv).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+xFmt(xv)+'</text>';
  }
  g+='<line class="axis" x1="'+pl+'" x2="'+pl+'" y1="'+pt+'" y2="'+(H-pb)+'"/>';
  g+='<line class="axis" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/>';
  o.series.forEach(function(s){
    if(!s.pts.length) return;
    var d=s.pts.map(function(p,i){ return (i?"L":"M")+X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1); }).join("");
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.w||1.6)+'" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="'+s.dash+'"':"")+'/>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||"chart")+'">'+g+'</svg>';
}

/* ================= Full equation (Python) ================= */
function codeLines(){
  var G=CODE.gains;
  function k(s){ return '<span class="tok-kw">'+s+'</span>'; }
  function n(s){ return '<span class="tok-num">'+s+'</span>'; }
  function c(s){ return '<span class="tok-cm">'+s+'</span>'; }
  function q(s){ return '<span class="tok-str">'+s+'</span>'; }
  function f(s){ return '<span class="tok-fn">'+s+'</span>'; }
  function p(s){ return '<span class="tok-param">'+s+'</span>'; }
  function ctrlLine(name,g,lim){
    return '    '+q('"'+name+'"')+': {'+q('"Kp"')+': '+n(g.Kp.toFixed(2))+', '+q('"Ki"')+': '+n(g.Ki.toFixed(2))+', '+
      q('"Kd"')+': '+n(g.Kd.toFixed(3))+', '+q('"u_min"')+': '+n(lim[0].toFixed(1))+', '+q('"u_max"')+': '+n(lim[1].toFixed(1))+'},';
  }
  return [
    k("import")+" numpy "+k("as")+" np",
    "",
    c("# MuloDesigner · Quanser 2-DOF helicopter · full cascade"),
    c("# Outer · Angle outputs become the setpoints of Inner · Rate"),
    "",
    c("# Physical parameters (Quanser datasheet)"),
    "Mp  = "+n("1.3872")+"      "+c("# kg    helicopter body mass"),
    "Jp  = "+n("0.0384")+"      "+c("# kg·m² pitch inertia"),
    "Jy  = "+n("0.0432")+"      "+c("# kg·m² yaw inertia"),
    "lcm = "+n("0.186")+"       "+c("# m     center-of-mass distance"),
    "Kpp = "+n("0.204")+"       "+c("# N·m/V pitch thrust gain"),
    "Kyy = "+n("0.072")+"       "+c("# N·m/V yaw thrust gain"),
    "Kpy = "+n("0.0068")+"      "+c("# N·m/V cross-coupling"),
    "Kyp = "+n("0.0219")+"      "+c("# N·m/V cross-coupling"),
    "Bp  = "+n("0.800")+"       "+c("# N·m·s/rad pitch damping"),
    "By  = "+n("0.318")+"       "+c("# N·m·s/rad yaw damping"),
    "g   = "+n("9.81"),
    "",
    c("# Inner · Rate: parallel PID controllers, one per controlled variable"),
    "INNER_RATE = {",
    ctrlLine("dpitch",G.dpitch,[-5,5]),
    ctrlLine("dyaw",G.dyaw,[-5,5]),
    "}",
    "",
    c("# Outer · Angle: outputs feed the inner-loop setpoints"),
    "OUTER_ANGLE = {",
    ctrlLine("pitch",G.pitch,[-1,1]),
    ctrlLine("yaw",G.yaw,[-1,1]),
    "}",
    "",
    k("def")+" "+f("pid")+"("+p("ctrl")+", "+p("error")+", "+p("integral")+", "+p("d_error")+", "+p("dt")+"):",
    "    "+q('"""Parallel PID with saturation. Returns (u, integral)."""'),
    "    integral += error * dt",
    "    u = ctrl["+q('"Kp"')+"] * error + ctrl["+q('"Ki"')+"] * integral + ctrl["+q('"Kd"')+"] * d_error",
    "    "+k("return")+" "+f("float")+"(np.clip(u, ctrl["+q('"u_min"')+"], ctrl["+q('"u_max"')+"])), integral",
    "",
    k("def")+" "+f("dynamics")+"("+p("t")+", "+p("x")+", "+p("u")+"):",
    "    "+q('"""Nonlinear dynamics. x = [theta, psi, theta_dot, psi_dot], u = [V_p, V_y]."""'),
    "    theta, psi, theta_d, psi_d = x",
    "    Vp, Vy = u",
    "    theta_dd = ((Kpp * Vp + Kpy * Vy) - Bp * theta_d - Mp * g * lcm * np.cos(theta)) / Jp",
    "    psi_dd = ((Kyy * Vy + Kyp * Vp) * np.cos(theta) - By * psi_d) / Jy",
    "    "+k("return")+" np.array([theta_d, psi_d, theta_dd, psi_dd])",
    "",
    c("# Cascade wiring: outer outputs become inner setpoints; inner outputs drive V_p, V_y")
  ];
}

/* ================= comparison report ================= */
function loopRow(key){
  var L=LOOPS[key]; if(!L.done.length) return null;

function simulate(g,d){
  var T=Math.max(0.5,d.T), dt=0.01, N=Math.round(T/dt);
  var wn=2+2.5*Math.sqrt(Math.max(g.Kp,0.05));
  var z=Math.min(1.2,Math.max(0.1,0.15+6.2*g.Kd));
  var sat=d.sat, p=d.sigp, sig=d.sig;
  function ref(t){
    var r=0;
    if(sig==="step") r=t>=p.t0?p.amp:0;
    else if(sig==="ramp") r=t>=p.t0?p.slope*(t-p.t0):0;
    else if(sig==="sine") r=p.amp*Math.sin(2*Math.PI*p.freq*t+p.phase)+p.offset;
    else if(sig==="regulate") r=p.sp+p.offset;
    else if(sig==="pulse") r=(t>=p.t0 && t<p.t0+p.width)?p.amp:0;
    if(sat.on) r=Math.max(sat.min,Math.min(sat.max,r));
    return r;
  }
  var y=0, v=0, ts=[], ys=[], rs=[], peak=-Infinity;
  for(var i=0;i<=N;i++){
    var t=i*dt, r=ref(t);
    ts.push(t); ys.push(y); rs.push(r); if(y>peak) peak=y;
    var acc=wn*wn*(r-y)-2*z*wn*v;
    v+=acc*dt; y+=v*dt;
  }
  var fin=rs[rs.length-1], os=null, st=null;
  if((sig==="step"||sig==="regulate") && Math.abs(fin)>1e-6){
    os=Math.max(0,(peak-fin)/Math.abs(fin)*100);
    var band=0.02*Math.abs(fin), last=0;
    for(var j=0;j<ys.length;j++) if(Math.abs(ys[j]-fin)>band) last=ts[j];
    st=last;
  }
  var trim=sig==="regulate"?p.sp+p.offset:(sig==="sine"?p.offset:0);
  return {ts:ts, ys:ys, rs:rs, trim:trim, overshoot:os, settle:st, peak:peak, T:T, sig:sig};
}
function plotBlock(r){
  var svg=lineChart({label:"Simulation response", h:230, w:600, x0:0, x1:r.T, xFmt:function(v){ return v.toFixed(0)+"s"; },
    yFmt:function(v){ return v.toFixed(2); }, series:[
      {color:"#60a5fa", w:1.8, pts:r.ts.map(function(t,i){ return [t,r.ys[i]]; })},
      {color:"#a3a3a3", w:1.4, dash:"5 4", pts:r.ts.map(function(t,i){ return [t,r.rs[i]]; })},
      {color:"#4ade80", w:1.2, dash:"1 3", pts:[[0,r.trim],[r.T,r.trim]]}
    ]});
  return '<div class="lab-legend"><span><i style="background:#60a5fa"></i> Actual value</span>'+
    '<span><i style="background:#a3a3a3"></i> Reference setpoint</span><span><i style="background:#4ade80"></i> Trim operating point</span></div>'+svg;
}

    var opts=[].slice.call(card.querySelectorAll(".hitl-option"));

    function paintSel(){ opts.forEach(function(o){ o.setAttribute("aria-pressed",String(o.dataset.value===selected)); }); }
    function paintCd(){ cd.textContent=remaining+"s"; secs.textContent=String(remaining); tbox.dataset.paused=String(paused); }
    function titleOf(v){ var o=spec.options.filter(function(x){ return x.v===v; })[0]; return o ? v+" · "+o.t : v; }
    function finish(value,text,auto,echo){
      if(done) return;
      done=true;
      clearInterval(timer); timer=null;
      if(S.gate && S.gate.card===card) S.gate=null;
      card.classList.add("is-resolved");
      st.classList.add("ok");
      st.innerHTML='<span class="hitl-status__dot ok"></span>'+(auto?"Auto-continued with "+value:"Received your input");
      if(echo) userSay(echo);
      resolve({value:value, text:text||"", auto:!!auto});
    }
    function tick(){
      if(paused) return;
      remaining--; paintCd();
      if(remaining<=0 && !touched) finish(spec.def,"",true,null);
    }
    timer=setInterval(tick,1000);
    paintCd();

    /* composer messages arrive here; they were already echoed in the chat */
    S.gate={type:"hitl", card:card, submit:function(text){
      var t=text.trim();
      if(ADVANCE.test(t)) return finish(selected||spec.def,"",false,null);
      var m=t.match(/^([a-d])\b/i);
      if(m && spec.options.some(function(o){ return o.v===m[1].toUpperCase(); })) return finish(m[1].toUpperCase(),"",false,null);
      return finish("T",t,false,null);
    }};

    opts.forEach(function(o){
      o.addEventListener("click",function(){
        touched=true; paused=true; selected=o.dataset.value; paintSel();
        other.value=""; confirmBtn.disabled=false; paintCd();
      });
    });
    other.addEventListener("input",function(){
      touched=true; paused=true; selected=null; paintSel();
      confirmBtn.disabled=!other.value.trim(); paintCd();
    });
    other.addEventListener("keydown",function(e){
      if(e.key==="Enter" && other.value.trim()){ e.preventDefault(); finish("T",other.value.trim(),false,other.value.trim()); }
    });
    confirmBtn.addEventListener("click",function(){
      if(other.value.trim()) return finish("T",other.value.trim(),false,other.value.trim());
      finish(selected||spec.def,"",false,titleOf(selected||spec.def));
    });
    card.querySelector(".hitl-card__skip").addEventListener("click",function(){
      finish(spec.def,"",false,"Skip — use the default ("+spec.def+")");
    });
    card.querySelector(".hitl-card__close").addEventListener("click",function(){
      card.style.display="none";
      finish(spec.def,"",false,"Dismissed — using "+spec.def);
    });
    card.querySelector(".hitl-card__edit").addEventListener("click",function(){
      touched=true; paused=true; paintCd();
      other.placeholder="Edit the control objective or describe the change…";
      other.focus();
    });
    card.querySelector(".hitl-card__timeout-cancel").addEventListener("click",function(e){
      e.stopPropagation();
      touched=true; clearInterval(timer); timer=null;
      cd.textContent="—"; secs.textContent="—"; tbox.dataset.paused="true";
    });
    tbox.addEventListener("mouseenter",function(){ if(!touched){ paused=true; paintCd(); } });
    tbox.addEventListener("mouseleave",function(){ if(!touched && timer){ paused=false; paintCd(); } });
  });
}

/* ================= inline config card ================= */
function buildCfgCard(key){
  var turn=el("div","assistant-turn");
  var card=el("div","cfg-card"); card.dataset.key=key;
  turn.appendChild(card); push(turn);
  S.cfgCards[key]=card;
  card.addEventListener("click",function(e){
    var b=e.target.closest("[data-act]");
    if(!b || card.classList.contains("is-done")) return;
    cfgAct(key,b.dataset.act);
  });
  card.addEventListener("keydown",function(e){
    if(e.key==="Enter" && e.target.classList && e.target.classList.contains("obj-input")){ e.preventDefault(); cfgAct(key,"obj-save"); }
  });
  renderCfgCard(key);
}
function renderCfgCard(key){
  var card=S.cfgCards[key]; if(!card) return;
  var c=S.cfg[key], L=LOOPS[key], pso=c.optimizer==="PSO Optimizer";
  var rows='<div class="cfg-row"><span>Architecture</span><span class="val">'+esc(c.optimizer)+'</span></div>';
  if(pso){
    rows+='<div class="cfg-row"><span>Search</span><span class="val">Population '+c.pop+' · Generations '+c.gens+'</span></div>';
  } else {
    rows+='<div class="cfg-row"><span>Budget</span><span class="val">Max attempts '+c.maxAttempts+' · Wall clock '+c.wallClock+'s · Cost budget $'+c.budget.toFixed(2)+'</span></div>'+
      '<div class="cfg-row"><span>LLM</span><span class="val">'+esc(c.llm)+'</span></div>';
  }
  var objRow=c._editing
    ? '<div class="cfg-row"><span>Objective</span><span class="obj-edit"><input class="obj-input" value="'+esc(c.objective)+'" aria-label="Control objective"/><button type="button" class="btn-ghost" data-act="obj-save">Save</button></span></div>'
    : '<div class="cfg-row"><span>Objective</span><span class="obj">“'+esc(c.objective)+'”</span></div>';
  var chips=[
    c.budget===1 ? ["budget-toggle","Lower cost budget"] : ["budget-toggle","Restore $1.00"],
    pso ? ["opt-toggle","Switch to Agentic GA"] : ["opt-toggle","Switch to PSO"],
    ["obj-edit","Edit objective"]
  ];
  card.innerHTML='<div class="cfg-title">PROPOSED CONFIG — '+esc(L.label)+'</div>'+rows+objRow+
    '<div class="cfg-chips">'+chips.map(function(ch){ return '<button type="button" class="chip-btn" data-act="'+ch[0]+'">'+esc(ch[1])+'</button>'; }).join("")+'</div>'+
    '<div class="cfg-foot"><button type="button" class="link-btn" data-act="open-cfg">All settings ↗</button>'+
      '<button type="button" class="btn-primary" data-act="start">Start '+L.short+' loop</button></div>';
  if(c._editing){ var inp=card.querySelector(".obj-input"); if(inp) inp.focus(); }
}
function touchCfg(key){
  renderCfgCard(key);
  if(S.openId==="cfg-"+key) renderPanel(curArt());
}
function doneCard(key){ var card=S.cfgCards[key]; if(card) card.classList.add("is-done"); }
function cfgAct(key,act){
  var c=S.cfg[key], card=S.cfgCards[key];
  if(act==="start"){
    userSay("Start "+LOOPS[key].short+" loop");
    doneCard(key);
    if(S.gate && S.gate.type==="config" && S.gate.key===key){ var g=S.gate; S.gate=null; g.resolve(); }
    return;
  }
  if(act==="budget-toggle") c.budget = c.budget===1 ? 0.5 : 1;
  else if(act==="opt-toggle") c.optimizer = c.optimizer==="PSO Optimizer" ? "Agentic GA" : "PSO Optimizer";
  else if(act==="obj-edit") c._editing=true;
  else if(act==="obj-save"){
    var inp=card.querySelector(".obj-input"), v=inp?inp.value.trim():"";
    if(v) c.objective=v;
    c._editing=false;
    agentNote("Objective updated.");
  }
  else if(act==="open-cfg"){ openArtifact("cfg-"+key); return; }
  touchCfg(key);
}
function awaitStart(key){
  return new Promise(function(resolve){
    S.gate={type:"config", key:key, resolve:resolve, submit:function(text){
      var t=text.trim();
      if(ADVANCE.test(t)){ var g=S.gate; S.gate=null; doneCard(key); g.resolve(); return; }
      S.cfg[key].objective=t;
      touchCfg(key);
      agentNote("Objective updated to “"+t+"”. Say go to start.");
    }};
  });
}

/* ================= attempt runner (streams status in place, one chip per attempt) ================= */
function syncCode(key){
  var L=LOOPS[key]; if(!L.final) return;
  L.ctrls.forEach(function(c){ CODE.gains[c]=copy(L.final.gains[c]); });
  CODE.version++;
  refreshIfOpen("code");
}
async function runAttempts(key,list){
  var L=LOOPS[key], cfg=S.cfg[key];
  if(!L.done.length) L.nfeStart=S.nfeTotal;
  openDock();
  agentSay("opt",["Running "+L.short+" loop with "+cfg.optimizer+
    (cfg.optimizer==="PSO Optimizer" ? " (population "+cfg.pop+", "+cfg.gens+" generations)" : " on "+cfg.llm)+
    ". Budget $"+cfg.budget.toFixed(2)+", up to "+cfg.maxAttempts+" attempts."],
    {loop:key, payload:{optimizer:cfg.optimizer, llm:cfg.llm, max_attempts:cfg.maxAttempts, wall_clock_s:cfg.wallClock,
      cost_budget_usd:cfg.budget, history_buffer_size:cfg.history, prompt_variant:cfg.variant, random_seed:cfg.seed}});

  for(let i=0;i<list.length;i++){
    let a=list[i], n=L.done.length+1;
    let pn=L.done.length?L.done[L.done.length-1].nfeEnd:L.nfeStart;
    let pb=L.done.length?L.done[L.done.length-1].best:L.baseline;
    for(let s=1;s<=3;s++){
      let nfe=Math.round(pn+(a.nfeEnd-pn)*s/3), best=pb+(a.best-pb)*s/3;
      S.nfeTotal=nfe;
      setDock("🎧 Running "+L.short+" loop · Attempt "+n+"/"+cfg.maxAttempts+" · NFE "+fmt(nfe)+" · Best cost "+best.toFixed(3));
      await sleep(650);
    }
    a.n=n;
    L.done.push(a);
    S.nfeTotal=a.nfeEnd;
    let idx=L.done.length-1;
    addArtifact({id:key+"-a"+n, kind:"tuning", title:L.name+" · Attempt "+n, type:"Tuning run · "+cfg.optimizer,
      data:{loop:key, idx:idx}, inline:true, chipTitle:L.name+" · Attempt "+n,
      chipSub:"Best cost "+a.best.toFixed(3)+" · Score "+a.score+"/100",
      actions:[{label:"Open"},{label:"Download gains", fn:function(){ downloadGains(key,idx); }}]});

    let met=a.score>=L.target, last=(i===list.length-1), unused=cfg.maxAttempts-n;
    logEntry("ev",key,"Attempt "+n+" scored "+a.score+"/100 against the "+L.target+" target.",
      {attempt:n, score:a.score, target:L.target, verdict:met?"accept":"continue", overshoot_pct:a.overshoot});
    if(met){
      agentSay("ev",["Attempt "+n+" scored "+a.score+"/100, which clears the "+L.target+" target."+
        (unused>0?" Stopping early with "+unused+" attempt"+(unused>1?"s":"")+" unused.":"")],{loop:key});
      break;
    }
    if(!last){
      agentSay("ft",[a.ft],{loop:key, payload:{adjustment:a.ft, next_attempt:n+1}});
    } else {
      agentSay("ev",["Attempt "+n+" scored "+a.score+"/100, below the "+L.target+" target. The run stops at the attempt limit."],{loop:key});
    }
  }
  closeDock();
  L.final=L.done[L.done.length-1];
  syncCode(key);
}

/* ================= sandbox artifact (opened from the inner-loop next-step card) ================= */
function openSandbox(){
  if(!S.artifacts.some(function(x){ return x.id==="sb-inner"; })){
    addArtifact({id:"sb-inner", kind:"sandbox", title:"Inner · Sandbox", type:"Simulation Lab · artifact",
      data:{ctrl:"dpitch", gains:copy(LOOPS.inner.final.gains), sat:{on:false,min:-5,max:5}, sig:"step",
        sigp:{amp:1,t0:1,slope:0.5,freq:0.5,phase:0,offset:0,sp:1,width:2}, T:10, last:null, sessions:[]},
      inline:true, chipTitle:"Inner · Sandbox", chipSub:"Simulation Lab · artifact", actions:[{label:"Open"}]});
  }
  openArtifact("sb-inner");
}

/* ================= scripted cascade: Quanser 2-DOF helicopter ================= */
function quickChip(label,fn){
  var b=el("button","chip-btn",esc(label)); b.type="button";
  b.addEventListener("click",fn);
  return b;
}
async function scenario(first){
  S.busy=true;
  activate();
  S.cfg.inner=makeCfg("inner");
  S.cfg.outer=makeCfg("outer");
  userSay(first);
  await sleep(550);

  agentSay("sup",["Got it — routing to MuloDesigner."]);
  await think(700);
  var archTurn=agentSay("arch",[
    "I’ll treat this as a two-loop cascade. The inner loop holds two parallel controllers, pitch-rate and yaw-rate, and the outer loop holds two more, pitch-angle and yaw-angle, whose outputs become the inner loop’s setpoints.",
    "I’ve loaded the default Quanser 2-DOF plant and this structure, so you can check the cascade before we tune anything."
  ],{route:"↳ handed off to MuloArchitect · plant + structure", payload:{structure:{loops:["inner_rate_control","outer_angle_control"],controllers:4}}});
  S.arch=addArtifact({id:"arch", kind:"arch", title:"Architecture diagram", type:"Block diagram · proposed", data:{final:false},
    inline:true, chipTitle:"Proposed architecture", chipSub:"Block diagram · 2 loops × 2 controllers", actions:[{label:"Open"}]}, archTurn);

  await sleep(500);
  var d1=await askHitl({
    title:"What should we do next with this plant model?",
    sub:"Choose an option or edit the draft objective.",
    def:"A",
    options:[
      {v:"A",t:"Confirm plant & structure and start tuning",d:"Accept the draft cascade and start the inner loop"},
      {v:"B",t:"Edit control objectives / loop order",d:"Change targets or swap which loop is tuned first"},
      {v:"C",t:"Change optimizer or budgets",d:"Switch GA / PSO, or adjust attempts, wall clock, and cost"},
      {v:"D",t:"Something else…",d:"Describe it in the box below"}
    ]
  });
  if(d1.auto) agentNote("Auto-continued with A after 30 s.");
  if(d1.value==="T"){
    S.cfg.inner.objective=d1.text;
    agentSay("arch",["Noted. I’ll fold that into the control objective before tuning starts."]);
  } else if(d1.value!=="A" && !d1.auto){
    agentSay("sup",["Noted. I’ll set that up in the run config before tuning starts."]);
  }

  var tr=makeTrace();
  push(tr.el);
  tr.label("Planning cascade…");
  var steps=["Planning cascade…","Inspecting plant & trim…","Drafting inner-loop GA config…"];
  for(let q=0;q<steps.length;q++){ await sleep(750); tr.add(steps[q]); }
  tr.done("Drafted inner-loop config");

  addArtifact({id:"json", kind:"json", title:"Structure JSON", type:"JSON · cascade structure · draft", data:{}});
  addArtifact({id:"code", kind:"code", title:"Full equation (Python)", type:"PY · draft from plant model", data:{}});
  addArtifact({id:"cfg-inner", kind:"config", title:"Inner · Rate · Config", type:"Run settings · editable", data:{key:"inner"}});

  await sleep(450);
  agentSay("sup",["Inner loop first, since its output sets the outer loop’s targets. Here’s the proposed config for rate control."],{loop:"inner"});
  buildCfgCard("inner");
  await awaitStart("inner");
  await runAttempts("inner", RUNS_INNER);
  agentSay("sup",["Inner loop (rate) complete — best cost "+LOOPS.inner.final.best.toFixed(3)+", score "+LOOPS.inner.final.score+
    "/100. A sandbox is ready if you want to tweak gains or test signals before locking."],{loop:"inner"});
  addArtifact({id:"inner-final", kind:"tuning", title:"Inner · Rate · Final gains + curves", type:"Tuning · loop final", data:{loop:"inner", idx:-1}});

  var decided=false, sbOpened=false, reran=false;
  while(!decided){
    var opts=[{v:"A",t:"Accept & move to outer loop",d:"Lock the inner loop and tune the angle loops next"}];
    if(!sbOpened) opts.push({v:"B",t:"Open Sandbox",d:"Adjust Kp / Ki / Kd and simulate step, ramp, sine, or pulse"});
    if(!reran) opts.push({v:"C",t:"Re-run inner loop with tighter overshoot constraint",d:"One more attempt under a 5% overshoot ceiling"});
    opts.push({v:"D",t:"Skip remaining loops / export now",d:"Package the inner loop as it stands"});
    var d2=await askHitl({title:"Inner loop is ready. What next?", sub:"Pick an option, or describe a change below.", def:"A", options:opts});
    if(d2.auto) agentNote("Auto-continued with A after 30 s.");
    if(d2.value==="B"){
      sbOpened=true;
      openSandbox();
      agentSay("sup",["Sandbox is open. Gains start at the inner loop’s final values. Apply any changes to the equation, then choose Accept to move on."],{loop:"inner"});
    } else if(d2.value==="C"){
      reran=true;
      agentSay("sup",["Re-running the inner loop with the overshoot ceiling at 5%. One more attempt is available under the budget."],{loop:"inner"});
      await runAttempts("inner", RUNS_RERUN);
      agentSay("sup",["Re-run complete. The inner loop is updated, and the outer loop will use the new gains."],{loop:"inner"});
    } else if(d2.value==="D"){
      S.skipOuter=true;
      agentSay("sup",["Skipping the outer loop. I’ll package the inner loop as it stands."]);
      decided=true;
    } else {
      decided=true;
      if(d2.value==="T") agentSay("sup",["Noted. I’ll apply that before the outer loop starts."]);
    }
  }

  if(!S.skipOuter){
    agentSay("sup",["Inner loop locked. The outer loop now treats the tuned rate loop as its plant, so its angle controllers can be tuned against that closed-loop response."],{loop:"outer"});
    addArtifact({id:"cfg-outer", kind:"config", title:"Outer · Angle · Config", type:"Run settings · editable", data:{key:"outer"}});
    buildCfgCard("outer");
    await awaitStart("outer");
    await runAttempts("outer", RUNS_OUTER);
    agentSay("sup",["Outer loop (angle) complete — best cost "+LOOPS.outer.final.best.toFixed(3)+", score "+LOOPS.outer.final.score+
      "/100. Both loops are locked, so the cascade is ready to package."],{loop:"outer"});
    addArtifact({id:"outer-final", kind:"tuning", title:"Outer · Angle · Final gains + curves", type:"Tuning · loop final", data:{loop:"outer", idx:-1}});
    S.arch.data.final=true;
    S.arch.type="Block diagram · final";
    renderRail();
    refreshIfOpen("arch");
  }

  addArtifact({id:"report", kind:"report", title:"Comparison report", type:"Metrics · loops + optimizers", data:{}});
  var head=S.skipOuter ? "Cascade finished (inner rate only; outer loop skipped)." : "Cascade finished (inner rate + outer angle).";
  var sum=agentSay("sup",[head],{loop:null});
  var list=el("div","artifacts");
  var items=[["arch","Architecture diagram"],["inner-final","Inner final gains + curves"]];
  if(!S.skipOuter) items.push(["outer-final","Outer final gains + curves"]);
  items.push(["code","Full equation (Python)"],["json","Structure JSON"],["report","Comparison report"]);
  if(S.artifacts.some(function(x){ return x.id==="sb-inner"; })) items.push(["sb-inner","Sandbox sessions"]);
  items.forEach(function(it){
    var art=S.artifacts.filter(function(x){ return x.id===it[0]; })[0];
    if(art) list.appendChild(chipEl(art,{title:it[1], sub:art.type, actions:[{label:"Open"}]}));
  });
  sum.appendChild(list);
  sum.appendChild(el("div","assistant-text","<p>Want a side-by-side cost comparison, a different outer-loop objective, or the download package?</p>"));
  var nx=el("div","next-row");
  nx.appendChild(quickChip("Side-by-side cost comparison",function(){ openArtifact("report"); }));
  nx.appendChild(quickChip("Different outer-loop objective",function(){ openArtifact("cfg-outer"); }));
  nx.appendChild(quickChip("Download package",function(){ download("mulo_structure.json", JSON.stringify(structureObj(),null,2), "application/json"); }));
  sum.appendChild(nx);
  S.busy=false;
  S.done=true;
}

/* ================= composer ================= */
function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,120)+"px"; }
function onUserText(text){
  if(!S.active){ if(!S.busy) scenario(text); return; }
  userSay(text);
  if(S.gate){ S.gate.submit(text); return; }
  if(S.busy) agentNote("Working on it — I’ll pick this up at the next decision point.");
  else if(S.done) agentNote("This mock ends at the wrap-up. Open any chip above to inspect it.");
  else agentNote("Nothing is waiting on you right now.");
}
form.addEventListener("submit",function(e){
  e.preventDefault();
  var t=input.value.trim();
  if(!t) return;
  input.value=""; autosize(); sendBtn.disabled=true;
  onUserText(t);
});
input.addEventListener("keydown",function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener("input",function(){ sendBtn.disabled=!input.value.trim(); autosize(); });

/* ================= init ================= */
$("#caseChip").addEventListener("click",function(){
  input.value="Quanser 2-DOF helicopter";
  sendBtn.disabled=false; autosize(); input.focus();
});
$("#resetBtn").addEventListener("click",function(){ location.reload(); });
$("#railClose").addEventListener("click",function(){ appEl.classList.remove("rail-open"); });
handle.addEventListener("click",function(){ appEl.classList.add("rail-open"); });
renderRail();

})();
</script>
