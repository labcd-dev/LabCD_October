prompt: |
  You are an expert System Identification Engineer.
  Task: Analyze CONTROLLER_STRUCTURE_JSON and TRIM_JSON to deduce the system's physical domain and execute precise web searches to synthesize operational constraints for automated multiloop PID tuning.

  ### Multiloop Tuning Context (CRITICAL)
  **Target Metrics:** This one is used for computing cost function during optimization process. Generally more inner loops need more strict targets but prioritize User Context on this one. If user context isn't provided start from outer loop consider logical target for each metric and set more inner ones based on that. 

  ### Protocol
  0. **User Context (HIGHEST PRIORITY):** A `USER_CONTEXT` string is supplied below. It may contain domain knowledge, datasheet values, safety envelopes, or hard operational limits.
     - If `USER_CONTEXT` is empty or the literal string `None`, IGNORE it and proceed normally.
     - If non-empty, treat it as AUTHORITATIVE. It OVERRIDES both web-search results and inferred values whenever they conflict.
     - When USER_CONTEXT and web search agree but USER_CONTEXT is more specific, use the tighter interval.
     - Enforce unit conversion into the unit convention of CONTROLLER_STRUCTURE_JSON.
  1. **Analyze & Search:** Deduce the system's physical domain and query reliable sources (academic papers, datasheets) for real-world actuator saturation limits AND safe operational envelope limits for state variables. 

  ### Direct Field Mapping Rules
  Copy the following fields EXACTLY from `CONTROLLER_STRUCTURE_JSON` without modification:
  - `loop_number`, `loop_name`, `controlled_variable`, `controlled_variable_in_equation`, `setpoint_variable_in_equation`, 'controller_output', `output_signal`, 'target', `output_variable_in_equation`.
  - Only synthesize the nested keys: `metrics`.
  - Ensure all bounds and targets use the exact unit conventions established in the inputs.
  - If fields that you're going to make already exist inside CONTROLLER_STRUCTURE_JSON don't change them and use exact default values.

  USER_CONTEXT:
  {USER_CONTEXT}

  ### Input Data
  ---
  {CONTROLLER_STRUCTURE_JSON}
  ---
  {TRIM_JSON}
  ---

 
  ### Expected Output Format
  Output ONLY a raw, valid JSON object matching the schema below. Do not include markdown code blocks, explanations, or conversational text.

  {{
    "deduced_domain": "string (e.g., Robotics, Process Control, Automotive, Aerospace)",
    "pid_loops": [
      {{
        "loop_number": integer,
        "loop_name": "string",
        "controllers": [
          {{
            "controlled_variable_in_equation": "string",
            "controlled_variable": "string",
            "output_variable_in_equation": "string",
            "output_variable": "string",
            "target": {{
              "description": "Deduced operational range of this state under typical tracking conditions",
              "min_value": float,
              "max_value": float,
              "unit": "string" 
            }},
            "controller_output": {{
              "variable_name": "string",
              "is_bounded": boolean,
              "min_bound": float,
              "max_bound": float,
              "unit": "string" 
            }}
          }}
        ],
        "metrics": {{
          "mse": float,
          "settling_time": float,
          "overshoot": float,
          "control_effort": float
        }}
      }}
    ]
  }}

schema:
  type: "object"
  properties:
    deduced_domain:
      type: "string"
      description: "string (e.g., Robotics, Process Control, Automotive, Aerospace)"
    pid_loops:
      type: "array"
      items:
        type: "object"
        properties:
          loop_number:
            type: "integer"
          loop_name:
            type: "string"
          controllers:
            type: "array"
            items:
              type: "object"
              properties:
                controlled_variable_in_equation:
                  type: "string"
                controlled_variable:
                  type: "string"
                output_variable_in_equation:
                  type: "string"
                output_variable:
                  type: "string"
                target:
                  type: "object"
                  properties:
                    description:
                      type: "string"
                      description: "Deduced operational range of this state under typical tracking conditions"
                    min_value:
                      type: "number"
                    max_value:
                      type: "number"
                    unit:
                      type: "string"
                  required: ["description", "min_value", "max_value", "unit"]
                  additionalProperties: false
                controller_output:
                  type: "object"
                  properties:
                    variable_name:
                      type: "string"
                    is_bounded:
                      type: "boolean"
                    min_bound:
                      type: "number"
                    max_bound:
                      type: "number"
                    unit:
                      type: "string"
                  required: ["variable_name", "is_bounded", "min_bound", "max_bound", "unit"]
                  additionalProperties: false
              required: ["controlled_variable_in_equation", "controlled_variable", "output_variable_in_equation", "output_variable", "target", "controller_output"]
              additionalProperties: false
          metrics:
            type: "object"
            properties:
              mse:
                type: "number"
              settling_time:
                type: "number"
              overshoot:
                type: "number"
              control_effort:
                type: "number"
            required: ["mse", "settling_time", "overshoot", "control_effort"]
            additionalProperties: false
        required: ["loop_number", "loop_name", "controllers", "metrics"]
        additionalProperties: false
  required: ["deduced_domain", "pid_loops"]
  additionalProperties: false