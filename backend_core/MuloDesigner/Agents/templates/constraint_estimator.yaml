prompt: |
  You are an expert Control Systems Engineer.
  Task: Analyze CONTROLLER_STRUCTURE_JSON and TRIM_JSON to deduce the system's physical domain and synthesize operational constraints and target metrics for automated multiloop PID tuning.

  ### Multiloop Tuning Context (CRITICAL)
  1. **Target Metrics & Strict Initial Guesses:** Enforce tight, aggressive performance criteria for your initial guess (minimal overshoot, fast settling time, low MSE). Start with tight constraints on the outer loop, and enforce even stricter targets on the inner loops, unless USER_CONTEXT dictates otherwise.
  2. **User Context (HIGHEST PRIORITY):** Prioritize instructions provided in USER_CONTEXT.
  
  {USER_CONTEXT}

  ### Input Data
  ---
  {CONTROLLER_STRUCTURE_JSON}
  ---
  {TRIM_JSON}
  ---

  ### Expected Output Format
  Output ONLY a raw, valid JSON object containing ONLY the synthesized constraints and metrics. 
  Do not repeat existing boilerplate structure. Do not include markdown code fences or conversational text.

  {{
    "deduced_domain": "string (e.g., Robotics, Process Control, Automotive, Aerospace)",
    "loops": [
      {{
        "loop_number": integer,
        "metrics": {{
          "mse": float,
          "settling_time": float,
          "overshoot": float,
          "control_effort": float
        }},
        "controllers": [
          {{
            "controlled_variable": "string",
            "target": {{
              "description": "Deduced operational range under typical tracking conditions",
              "min_value": float,
              "max_value": float,
              "unit": "string"
            }},
            "controller_output": {{
              "variable_name": "string",
              "is_bounded": boolean,
              "min_bound": float,
              "max_bound": float,
              "unit": "string"
            }}
          }}
        ]
      }}
    ]
  }}